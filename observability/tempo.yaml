stream_over_http_enabled: true   # recherche en continu depuis Grafana

server:
  http_listen_port: 3200

distributor:                     # réception des spans
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:                        # regroupement par trace
  max_block_duration: 5m

compactor:                       # rétention de 48 h
  compaction:
    block_retention: 48h

metrics_generator:               # métriques envoyées à Prometheus
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:                         # stockage local
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
