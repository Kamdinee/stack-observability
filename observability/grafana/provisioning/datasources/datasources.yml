# Sources de données Grafana (chargées automatiquement au démarrage)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:            # rend le traceId cliquable
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:           # bouton « voir les logs » sur un span
        datasourceUid: loki
        filterByTraceID: true
      serviceMap:               # carte des services
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
